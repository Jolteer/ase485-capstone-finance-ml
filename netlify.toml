[build]
publish = "build/web"
command = """
  set -euo pipefail

  if [ -z "${API_BASE_URL:-}" ]; then
    echo "ERROR: API_BASE_URL is not set in Netlify environment variables." >&2
    echo "       Site Settings -> Build & deploy -> Environment -> Environment variables" >&2
    echo "       Add API_BASE_URL = https://<your-railway-domain>/api/v1" >&2
    exit 1
  fi

  FLUTTER_VERSION="3.38.7"
  if [ ! -d "_flutter" ]; then
    git clone https://github.com/flutter/flutter.git -b "$FLUTTER_VERSION" --depth 1 _flutter
  fi
  git config --global --add safe.directory '*'
  export PATH="$PATH:$(pwd)/_flutter/bin"

  flutter --version
  flutter config --enable-web
  flutter pub get
  flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"
"""

# Flutter web is a single-page app: every route must serve index.html
[[redirects]]
from = "/*"
to = "/index.html"
status = 200
